<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" fill="none">
<style>
:root{--diagram-paper:#efede5;--diagram-ink:#242522;--diagram-card:#f7f5ef;--diagram-accent:#f36a1d;--diagram-secondary:#264536}
path[stroke-dasharray]{stroke:var(--diagram-secondary)}
@media(prefers-color-scheme:dark){:root{--diagram-paper:#20231f;--diagram-ink:#eeece5;--diagram-card:#2a2d26;--diagram-accent:#7b3a1c;--diagram-secondary:#a5c6a9}}
</style>
  <rect width="1000" height="430" fill="var(--diagram-paper)"/>
  <g fill="var(--diagram-ink)" font-family="Arial,sans-serif"><text x="54" y="58" font-size="12" letter-spacing="2">FROM REQUEST TO ACCEPTED WORK</text><text x="54" y="386" font-size="13">A generated answer crosses a boundary. A finished task meets a standard.</text></g>
  <path d="M225 210H300M480 210H555M740 210H810" stroke="var(--diagram-ink)" stroke-width="2"/><path d="m293 204 7 6-7 6m255-12 7 6-7 6m255-12 7 6-7 6" stroke="var(--diagram-ink)" stroke-width="2"/>
  <path d="M80 133H225V286H54V218Z" fill="var(--diagram-card)" stroke="var(--diagram-ink)" stroke-width="2"/>
  <path d="M328 133H480V286H300V218Z" fill="var(--diagram-card)" stroke="var(--diagram-ink)" stroke-width="2"/>
  <path d="M583 133H740V286H555V218Z" fill="var(--diagram-accent)" stroke="var(--diagram-ink)" stroke-width="2"/>
  <circle cx="879" cy="210" r="68" fill="var(--diagram-ink)"/>
  <g fill="var(--diagram-ink)" font-family="Arial,sans-serif"><text x="80" y="173" font-size="11" letter-spacing="1">01</text><text x="80" y="225" font-size="25">Request</text><text x="328" y="173" font-size="11" letter-spacing="1">02</text><text x="328" y="225" font-size="25">Draft</text><text x="583" y="173" font-size="11" letter-spacing="1">03</text><text x="583" y="225" font-size="25">Review</text></g>
  <g fill="var(--diagram-card)" font-family="Arial,sans-serif" text-anchor="middle"><text x="879" y="207" font-size="19">Accepted</text><text x="879" y="232" font-size="19">work</text></g>
  <path d="M648 299V332H390V299" stroke="var(--diagram-ink)" stroke-width="1.5" stroke-dasharray="4 5"/><path d="m384 307 6-8 6 8" stroke="var(--diagram-ink)" stroke-width="1.5"/><text x="470" y="322" fill="var(--diagram-ink)" font-size="12" font-family="Arial,sans-serif">revise if needed</text>
</svg>
