<svg xmlns="http://www.w3.org/2000/svg" width="440" height="700" viewBox="0 0 440 700" fill="none">
<style>
:root{--diagram-paper:#efede5;--diagram-ink:#242522;--diagram-card:#f7f5ef;--diagram-accent:#f36a1d;--diagram-secondary:#264536}
path[stroke-dasharray]{stroke:var(--diagram-secondary)}
@media(prefers-color-scheme:dark){:root{--diagram-paper:#20231f;--diagram-ink:#eeece5;--diagram-card:#2a2d26;--diagram-accent:#7b3a1c;--diagram-secondary:#a5c6a9}}
</style>
  <rect width="440" height="700" fill="var(--diagram-paper)"/>
  <text x="35" y="43" font-size="11" letter-spacing="1" fill="var(--diagram-ink)" font-family="Arial,sans-serif">FROM REQUEST TO ACCEPTED WORK</text>
  <g stroke="var(--diagram-ink)" stroke-width="2"><path d="M220 170V210M220 305V345M220 440V485"/><path d="m214 202 6 8 6-8m-12 135 6 8 6-8m-12 132 6 8 6-8"/>
  <path d="M88 75H365V170H75V115Z" fill="var(--diagram-card)"/><path d="M88 210H365V305H75V250Z" fill="var(--diagram-card)"/><path d="M88 345H365V440H75V385Z" fill="var(--diagram-accent)"/></g>
  <g fill="var(--diagram-ink)" font-family="Arial,sans-serif"><text x="102" y="110" font-size="10">01</text><text x="102" y="146" font-size="26">Request</text><text x="102" y="245" font-size="10">02</text><text x="102" y="281" font-size="26">Draft</text><text x="102" y="380" font-size="10">03</text><text x="102" y="416" font-size="26">Review</text></g>
  <circle cx="220" cy="555" r="68" fill="var(--diagram-ink)"/><text x="220" y="550" text-anchor="middle" fill="var(--diagram-card)" font-family="Arial,sans-serif" font-size="21">Accepted</text><text x="220" y="577" text-anchor="middle" fill="var(--diagram-card)" font-family="Arial,sans-serif" font-size="21">work</text>
  <path d="M365 393H403V258H372" stroke="var(--diagram-ink)" stroke-width="1.5" stroke-dasharray="4 5"/><path d="m380 252-8 6 8 6" stroke="var(--diagram-ink)" stroke-width="1.5"/>
  <text x="35" y="659" fill="var(--diagram-ink)" font-size="12" font-family="Arial,sans-serif">Review can lead to acceptance or another draft.</text>
</svg>
